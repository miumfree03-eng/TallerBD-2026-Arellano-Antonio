<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Préstamos de equipo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="pagina-login">
    <section class="tarjeta caja-login">
      <h1>Préstamos de equipo</h1>
      <p class="subtitulo">Departamento de Soporte y Servicios Tecnológicos</p>

      <!-- En el backend se enviará por POST a un script PHP que verifica la contraseña con password_verify().
           El rol del usuario (ADMIN o CONSULTA) decide qué puede hacer dentro del sistema. -->
      <form data-validar novalidate>
        <div class="aviso aviso-formulario" hidden></div>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" type="text" required autocomplete="username">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <div class="botones">
          <button class="boton" type="submit">Entrar</button>
          <a class="boton secundario" href="index.html">Ver demo</a>
        </div>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
